# 【防泄漏核心】带 IP 判定的规则严格置底，且必须追加 no-resolve 标记！
# 这样当遇到未知的国外域名时，小火箭不会在手机本地触发 DNS 查询，完美免疫泄漏
GEOIP,CN,DIRECT,no-resolve

# 表示当其他所有规则都匹配不到时才使用FINAL规则的策略。
FINAL,PROXY

[Host]
# 【高级优化】系统级和 iCloud 核心服务使用 syslib 强制本地系统解析，防止被代理劫持或引发同步异常
*.apple.com = server:syslib
*.icloud.com = server:syslib
localhost = 127.0.0.1

https://ahrefs.com/writing-tools/paragraph-rewriter
# Google搜索引擎防跳转的重写。
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
# Shadowrocket仅会解密hostname指定的域名的请求，可以使用通配符。
hostname = *.google.cn

